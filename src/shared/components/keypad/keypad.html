<div class="keypad">
  @for (key of keys; track key) {
    <button mat-flat-button [disabled]="key === 'enter' && !enterEnabled()" (click)="onKeyPress(key)">
      @switch (key) {
        @case ('delete') {
          Del
        }
        @case ('enter') {
          Ent.
        }
        @default {
          {{ key }}
        }
      }
    </button>
  }
</div>
