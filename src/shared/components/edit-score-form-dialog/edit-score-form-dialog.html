<form class="dialog-container" (submit)="onSubmit(); $event.preventDefault()">

  <div class="header">
    <h2 mat-dialog-title class="title">Edit Score</h2>
  </div>

  <mat-dialog-content class="content">
    <h3 class="subtitle">
      {{ playerName }} · Set {{ setNumber }} · Leg {{ legNumber }} · Round {{ roundNumber }}
    </h3>

    <div class="form-field">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>New Score</mat-label>
        <input matInput type="number" [formField]="editScoreForm.score"/>
      </mat-form-field>

      <app-form-error [field]="editScoreForm.score"/>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="actions" align="end">
    <button type="button" mat-button mat-dialog-close>Cancel</button>
    <button type="submit" mat-button cdkFocusInitial>Ok</button>
  </mat-dialog-actions>
</form>
