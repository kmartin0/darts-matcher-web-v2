<div class="home-page-component-container">
  <div class="header-container">
    <h1 class="header">Darts Matcher</h1>
    <h2 class="subheader">Create, play and share your darts matches.</h2>
  </div>

  <div class="form-container">
    <div class="container-horizontal create-match-header">
      <h3>Create Match</h3>
      <app-theme-toggle></app-theme-toggle>
    </div>
    <app-create-x01-match-form
      [loading]="uiState().isCreatingX01Match"
      (createMatch)="onX01MatchSubmit($event)"/>
  </div>
</div>
