<form [formRoot]="matchIdForm">
  <div class="container-vertical">
    <mat-form-field subscriptSizing="dynamic" appearance="outline">
      <mat-label>Match ID</mat-label>

      <input
        matInput
        type="text"
        [formField]="matchIdForm.matchId"/>

      <button
        matSuffix
        mat-icon-button
        type="submit"
        aria-label="Go to match"
        matTooltip="Go to match"
        [disabled]="matchIdForm().submitting()">
        <mat-icon>arrow_forward</mat-icon>
      </button>
    </mat-form-field>

    <app-form-error [field]="matchIdForm.matchId"/>
  </div>
</form>
