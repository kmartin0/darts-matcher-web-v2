<mat-tab-group
  class="tab-group"
  mat-align-tabs="center"
  mat-stretch-tabs="false">
  <!-- Match information tab -->
  <mat-tab label="Information">
    <div class="tab-content-container">
      <app-match-information [match]="match()"/>
    </div>
  </mat-tab>

  <!-- Match statistics tab -->
  <mat-tab label="Statistics">
    <div class="tab-content-container">
      <app-match-statistics [match]="match()"/>
    </div>
  </mat-tab>

  <!-- Match timeline tab -->
  <mat-tab label="Timeline">
    <div class="tab-content-container">
      <app-match-timeline [match]="match()"/>
    </div>
  </mat-tab>
</mat-tab-group>
