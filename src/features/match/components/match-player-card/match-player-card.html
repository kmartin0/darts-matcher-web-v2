@let player = data();

<div
  class="match-player-card"
  [class.current-thrower]="player.isCurrentThrower"
  [class.starts-leg]="player.startsLeg"
  [class.win-or-draw]="player.isWinOrDraw">

  <mat-card class="player-info-card">
    <span class="player-name">{{ player.name }}</span>
    <span class="player-score">
      Score: {{ player | playerScore }}
    </span>
  </mat-card>

  <mat-card class="player-stats-card">
    <span class="remaining">{{ player.remaining }}</span>
    <span class="checkout-hint">{{ player.suggestedCheckout | suggestedCheckout }}</span>

    <div class="divider divider-1" aria-hidden="true"></div>

    <div class="stat-container three-dart">
      <span class="stat-label">3-Dart</span>
      <span class="stat-value">{{ player.average ?? '-' }}</span>
    </div>

    <div class="divider divider-2" aria-hidden="true"></div>

    <div class="stat-container first-nine">
      <span class="stat-label">First 9</span>
      <span class="stat-value">{{ player.averageFirstNine ?? '-' }}</span>
    </div>

    <div class="divider divider-3" aria-hidden="true"></div>

    <div class="stat-container last-score">
      <span class="stat-label">Last</span>
      <span class="stat-value">{{ player.lastScore ?? '-' }}</span>
    </div>

    <div class="divider divider-4" aria-hidden="true"></div>

    <div class="stat-container darts-used">
      <span class="stat-label">Darts</span>
      <span class="stat-value">{{ player.dartsUsed }}</span>
    </div>
  </mat-card>
</div>
