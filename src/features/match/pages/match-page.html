@let state = uiState().match;

<app-match-toolbar
  [menuVisible]="state.status === 'loaded'"
  [loading]="toolbarLoading()"
  (copyMatchId)="onCopyMatchId()"
  (copyMatchLink)="onCopyMatchLink()"/>

@switch (state.status) {
  @case ('idle') {
  }
  @case ('loading') {
    <mat-spinner/>
  }
  @case ('error') {
    <app-page-error message="The match could not be found"/>
  }
  @case ('loaded') {
    <app-match-board [match]="state.data"/>
  }
}
