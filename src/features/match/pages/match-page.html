@let matchLoadState = uiState().match;

<app-match-toolbar
  [menuVisible]="matchLoadState.status === 'loaded'"
  [error]="uiState().toolbarError"
  [loading]="toolbarLoading()"
  (repairMatch)="onRepairMatch()"
  (copyMatchId)="onCopyMatchId()"
  (copyMatchLink)="onCopyMatchLink()"/>

@switch (matchLoadState.status) {
  @case ('idle') {
  }
  @case ('loading') {
    <mat-spinner/>
  }
  @case ('error') {
    <app-page-error message="The match could not be found"/>
  }
  @case ('loaded') {
    <app-match-board [match]="matchLoadState.data"/>
  }
}
